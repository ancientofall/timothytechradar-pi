<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">TimothyTechRadar logo</title>
  <desc id="desc">A navy and teal radar mark with the TimothyTechRadar wordmark.</desc>
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#28d7c1"/>
      <stop offset="1" stop-color="#3988ff"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#28d7c1" stop-opacity=".12"/>
      <stop offset="1" stop-color="#3988ff" stop-opacity=".8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="48" fill="#08142f"/>
  <g transform="translate(42 42)">
    <circle cx="118" cy="118" r="108" fill="#0d2146" stroke="#1c3764" stroke-width="4"/>
    <path d="M118 118 L190 35 A108 108 0 0 0 206 118 Z" fill="url(#beam)"/>
    <circle cx="118" cy="118" r="82" fill="none" stroke="#2a4c7c" stroke-width="5"/>
    <circle cx="118" cy="118" r="52" fill="none" stroke="#2a4c7c" stroke-width="5"/>
    <path d="M118 10 V226 M10 118 H226" stroke="#2a4c7c" stroke-width="3" opacity=".75"/>
    <path d="M118 118 L190 35" stroke="url(#ring)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="118" cy="118" r="15" fill="#f6c453"/>
    <circle cx="181" cy="50" r="9" fill="#28d7c1"/>
  </g>
  <text x="315" y="154" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="67" font-weight="700" letter-spacing="-2">Timothy<tspan fill="#28d7c1">Tech</tspan><tspan fill="#3988ff">Radar</tspan></text>
  <text x="321" y="204" fill="#9bb0cf" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" letter-spacing="5">DISCOVER WHAT'S NEXT</text>
</svg>
