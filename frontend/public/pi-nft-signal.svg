<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">Pi NFT Signal Field Guide</title>
  <desc id="desc">A blue signal beacon over layered rings for the Pi NFT Signal Field Guide.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#112b5d"/><stop offset="1" stop-color="#071328"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7de8df"/><stop offset="1" stop-color="#4c78e8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="800" rx="46" fill="url(#bg)"/>
  <g fill="none" stroke="#4c78e8" stroke-width="4" opacity=".48"><circle cx="400" cy="260" r="190"/><circle cx="400" cy="260" r="128"/><circle cx="400" cy="260" r="66"/><path d="M400 50v420M190 260h420"/></g>
  <path d="M400 260 L650 110 L530 350 Z" fill="url(#beam)" opacity=".35"/>
  <g filter="url(#glow)"><circle cx="400" cy="260" r="34" fill="#f4c45e"/><path d="M400 145 L427 233 L515 260 L427 287 L400 375 L373 287 L285 260 L373 233 Z" fill="url(#beam)"/></g>
  <text x="400" y="555" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700">PI NFT SIGNAL</text>
  <text x="400" y="615" text-anchor="middle" fill="#7de8df" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">FIELD GUIDE</text>
  <text x="400" y="690" text-anchor="middle" fill="#b9c8e2" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="3">UTILITY • RIGHTS • RISK • BUILD</text>
</svg>
