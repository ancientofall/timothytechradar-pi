version: "3.9"
services:
  reverse-proxy:
    restart: unless-stopped
    build: ./reverse-proxy
    environment:
      HTTPS: ${HTTPS}
      FRONTEND_DOMAIN_NAME: ${FRONTEND_DOMAIN_NAME}
      BACKEND_DOMAIN_NAME: ${BACKEND_DOMAIN_NAME}
      DOMAIN_VALIDATION_KEY: ${DOMAIN_VALIDATION_KEY}
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD-SHELL", "curl --noproxy '*' --fail --silent --show-error --max-time 8 --resolve $${FRONTEND_DOMAIN_NAME}:443:127.0.0.1 https://$${FRONTEND_DOMAIN_NAME}/ -o /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - ${DATA_DIRECTORY}/reverse-proxy/etc-letsencrypt:/etc/letsencrypt/

  frontend:
    restart: unless-stopped
    build: ./frontend
    environment:
      BACKEND_URL: ${BACKEND_URL}

  backend:
    restart: unless-stopped
    volumes:
      - ./backend/private:/usr/src/app/private:ro
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      NODE_ENV: ${ENVIRONMENT}
      SESSION_SECRET: ${SESSION_SECRET}
      PI_API_KEY: ${PI_API_KEY}
      PLATFORM_API_URL: ${PLATFORM_API_URL}
      MONGO_HOST: mongo
      MONGODB_DATABASE_NAME: ${MONGODB_DATABASE_NAME}
      MONGODB_USERNAME: ${MONGODB_USERNAME}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL}
      CONTACT_TO: ${CONTACT_TO:-}
      CONTACT_FROM: ${CONTACT_FROM:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      CONTACT_RATE_SECRET: ${CONTACT_RATE_SECRET:-}

  mongo:
    restart: unless-stopped
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD}
    ports:
      - 27027:27017
    volumes:
      - ${DATA_DIRECTORY}/mongo/data:/data/db
